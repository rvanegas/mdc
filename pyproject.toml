[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdc"
version = "0.1.23"
description = "Unified CLI for markdown chats with LLMs."
readme = "mdc/README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "platformdirs>=4.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
mdc = "mdc.cli:main"

[tool.setuptools]
packages = ["mdc"]

[tool.setuptools.package-data]
mdc = ["*.toml", "*.md", "deployed.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
