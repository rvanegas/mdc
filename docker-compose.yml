services:
  mdc:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # System-wide config from the image; one asset cache for the server's API
    # key. Libraries are /data/libraries/<user>/<library>, each with its own
    # .mdc/ state (SERVER.md).
    environment:
      MDC_CONFIG_DIR: /etc/mdc
      MDC_CACHE_DIR: /data/cache
    # The box's deploy user (ubuntu), which owns /srv/mdc, so files written
    # into the libraries stay editable from the host.
    user: "1000:1000"
    volumes:
      - /srv/mdc:/data
    # Loopback only: Caddy on the box is the one public front door
    # (rvanegas-site's Caddyfile).
    ports:
      - "127.0.0.1:8001:8001"
